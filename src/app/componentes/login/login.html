<div class="max-w-md mx-auto my-10 p-6 bg-white rounded-lg shadow-md font-sans">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>

  @if (errorMessage) {
    <div class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded">
      {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-gray-600">Correo Electrónico</label>
      <input type="email" [(ngModel)]="loginData.email" name="email" required 
             class="w-full p-2 border rounded text-sm focus:outline-emerald-500">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Contraseña</label>
      <input type="password" [(ngModel)]="loginData.password_hash" name="password_hash" required 
             class="w-full p-2 border rounded text-sm focus:outline-emerald-500">
    </div>

    <button type="submit" [disabled]="!loginForm.form.valid"
            class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 text-white font-bold rounded shadow transition">
      Ingresar
    </button>
  </form>

  <p class="mt-4 text-xs text-center text-gray-600">
    ¿No tienes una cuenta? 
    <a routerLink="/register" class="text-emerald-600 font-semibold hover:underline">Regístrate aquí</a>
  </p>
</div>
