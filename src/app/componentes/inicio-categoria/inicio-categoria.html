<section class="max-w-7xl mx-auto px-4 py-12">
  
  <!-- Encabezado de la Sección (Centrado y minimalista como en la imagen) -->
  <div class="text-center mb-8">
    <h2 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">
      ¿Dónde vamos?
    </h2>
    <p class="text-base text-slate-500 max-w-2xl mx-auto">
      Descubre rincones inolvidables, monumentos históricos y la mejor gastronomía a tu alrededor.
    </p>
  </div>

  <!-- Buscador posicionado entre el título y las categorías -->
  <div class="flex justify-center mb-12">
    <!-- El componente app-buscador que ya estilizamos antes -->
    <app-buscador class="w-full max-w-2xl"></app-buscador>
  </div>

  <!-- Estado de Carga (Skeleton loader adaptado a círculos) -->
  @if (cargando()) {
    <div class="flex flex-wrap justify-center gap-8 sm:gap-12">
      @for (item of [1,2,3,4,5]; track $index) {
        <div class="flex flex-col items-center gap-3 animate-pulse">
          <div class="w-20 h-20 sm:w-24 sm:h-24 bg-slate-200 rounded-full shadow-sm"></div>
          <div class="h-4 bg-slate-200 rounded w-16"></div>
        </div>
      }
    </div>
  } @else {
    <!-- Grid de Categorías (Diseño circular minimalista) -->
    <div class="flex flex-wrap justify-center gap-6 sm:gap-12">
      @for (cat of categorias(); track cat.id) {
        <button 
          (click)="seleccionarCategoria(cat.id)"
          class="group flex flex-col items-center gap-3 cursor-pointer focus:outline-none"
        >
          <!-- Círculo de Contenedor de Imagen -->
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full overflow-hidden shadow-md group-hover:shadow-lg group-hover:-translate-y-1 transition-all duration-300 border-2 border-transparent group-hover:border-[#2d5a27]" [ngClass]="obtenerEstiloPorId(cat.id)">
            @if (cat.icono) {
              <!-- object-cover corrige la distorsión de la imagen -->
              <img 
                [src]="cat.icono" 
                [alt]="cat.nombre" 
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
              />
            } @else {
              <!-- Icono por defecto si la categoría no tiene foto -->
              <div class="w-full h-full bg-slate-50 flex items-center justify-center">
                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </div>
            }
          </div>

          <!-- Nombre de la categoría -->
          <h3 class="font-semibold text-slate-800 text-sm group-hover:text-[#2d5a27] transition-colors">
            {{ cat.nombre }}
          </h3>
        </button>
      }
    </div>
  }
</section>
