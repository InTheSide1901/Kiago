<app-buscador></app-buscador>
<section class="max-w-7xl mx-auto px-4 py-8">
  <!-- Encabezado de la Sección -->
  <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-4">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
        Descubrí la Ciudad
      </span>
      <h2 class="text-3xl font-extrabold text-slate-900 mt-2 tracking-tight">
        Explorar por Categorías
      </h2>
    </div>
    <p class="text-sm text-slate-500 max-w-sm">
      Encontrá los mejores lugares cerca tuyo filtrando según lo que tengas ganas de hacer hoy.
    </p>
  </div>

  <!-- Estado de Carga (Skeleton loader) -->
  @if (cargando()) {
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
      @for (item of [1,2,3,4,5]; track $index) {
        <div class="animate-pulse bg-slate-100 rounded-2xl h-44 flex flex-col items-center justify-center p-4">
          <div class="w-16 h-16 bg-slate-200 rounded-full mb-3"></div>
          <div class="h-4 bg-slate-200 rounded w-2/3"></div>
        </div>
      }
    </div>
  } @else {
    <!-- Grid de Categorías -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
      @for (cat of categorias(); track cat.id) {
        <button 
          (click)="seleccionarCategoria(cat.id)"
          class="group relative overflow-hidden rounded-2xl bg-white border border-slate-100 p-5 shadow-sm hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center text-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          <!-- Fondo de Resplandor sutil al hacer hover -->
          <div class="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-300" [ngClass]="obtenerEstiloPorId(cat.id)"></div>

          <!-- Círculo de Contenedor de Imagen / Ícono -->
          <div class="relative w-20 h-20 mb-4 rounded-full p-1 shadow-md group-hover:scale-110 transition-transform duration-300" [ngClass]="obtenerEstiloPorId(cat.id)">
            <div class="w-full h-full rounded-full overflow-hidden bg-white flex items-center justify-center border-2 border-white">
              @if (cat.icono) {
                <!-- object-cover corrige la distorsión de la imagen -->
                <img 
                  [src]="cat.icono" 
                  [alt]="cat.nombre" 
                  class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                />
              } @else {
                <!-- Icono por defecto si la categoría no tiene foto -->
                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              }
            </div>
          </div>

          <!-- Nombre y Detalle -->
          <h3 class="font-bold text-slate-800 text-base group-hover:text-indigo-600 transition-colors">
            {{ cat.nombre }}
          </h3>
          <span class="text-xs text-slate-400 font-medium mt-1 group-hover:text-slate-600 transition-colors">
            Explorar opciones &rarr;
          </span>
        </button>
      }
    </div>
  }
</section>
