<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 font-sans">
      <div class="max-w-3xl mx-auto">
        
        <!-- Header del Perfil -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden mb-6">
          <!-- Banner Superior -->
          <div class="h-32 bg-gradient-to-r from-red-500 to-red-600"></div>
          
          <div class="px-6 sm:px-10 pb-8 relative">
            <!-- Foto de Perfil -->
            <div class="relative -mt-16 mb-4 flex justify-between items-end">
              <div class="w-32 h-32 rounded-full border-4 border-white bg-gray-200 overflow-hidden shadow-md shrink-0">
                <img 
                  [src]="usuario?.foto_perfil || 'assets/default-avatar.png'" 
                  [alt]="usuario?.nombre" 
                  class="w-full h-full object-cover"
                />
              </div>
              <button class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-2.5 rounded-full font-medium text-sm transition-colors shadow-sm">
                Editar Perfil
              </button>
            </div>
            
            <!-- Nombre y Rol -->
            <div>
              <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                {{ usuario?.nombre }} {{ usuario?.apellido }}
              </h1>
              <p class="text-red-500 font-medium mt-1 flex items-center gap-1.5">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
                <!-- Renderizamos el rol dependiendo del rol_id -->
                {{ obtenerNombreRol(usuario?.rol_id) }}
              </p>
            </div>
          </div>
        </div>

        <!-- Tarjeta de Información Personal -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 sm:p-10">
          <h2 class="text-xl font-bold text-gray-900 mb-6 border-b border-gray-100 pb-4">
            Información de Contacto
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Email -->
            <div>
              <label class="block text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">
                Correo Electrónico
              </label>
              <div class="flex items-center text-gray-900 font-medium">
                <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                {{ usuario?.email }}
              </div>
            </div>

            <!-- Teléfono -->
            <div>
              <label class="block text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">
                Teléfono
              </label>
              <div class="flex items-center text-gray-900 font-medium">
                <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
                {{ usuario?.telefono || 'No especificado' }}
              </div>
            </div>

            <!-- Miembro desde (created_at) -->
            <div>
              <label class="block text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">
                Miembro desde
              </label>
              <div class="flex items-center text-gray-900 font-medium">
                <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                {{ usuario?.created_at | date:'mediumDate' }}
              </div>
            </div>

          </div>
        </div>

        <!-- Acciones de sesión -->
        <div class="mt-6 flex justify-end">
          <button (click)="cerrarSesion()" class="text-red-500 hover:text-red-700 font-semibold flex items-center gap-2 transition-colors px-4 py-2 hover:bg-red-50 rounded-xl">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Cerrar Sesión
          </button>
        </div>

      </div>
    </div>
