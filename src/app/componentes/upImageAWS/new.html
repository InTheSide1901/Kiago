<div class="container">
  <h2>Registrar Local e Imagen (S3 + MySQL)</h2>

  <form [formGroup]="localForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="nombre">Nombre del local:</label>
      <input 
        id="nombre" 
        type="text" 
        formControlName="nombre" 
        placeholder="Ej. Mi Local" 
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="imagen">Seleccionar imagen (PC o Móvil):</label>
      <input 
        id="imagen" 
        type="file" 
        accept="image/*" 
        (change)="onFileSelected($event)" 
        class="form-control"
      />
    </div>

    <button type="submit" [disabled]="cargando || localForm.invalid || !selectedFile">
      {{ cargando ? 'Subiendo a S3...' : 'Guardar Registro' }}
    </button>

  </form>

  <!-- Mensajes de estado -->
  <div *ngIf="errorMensaje" class="alert alert-danger">
    <strong>Error:</strong> {{ errorMensaje }}
  </div>

  <div *ngIf="respuestaExitosa" class="alert alert-success">
    <p><strong>¡Guardado con éxito!</strong></p>
    <p><strong>ID registrado:</strong> {{ respuestaExitosa.id }}</p>
    <p><strong>URL en S3:</strong> 
      <a [href]="respuestaExitosa.imagen_principal" target="_blank">
        {{ respuestaExitosa.imagen_principal }}
      </a>
    </p>
    <p><strong>Vista previa:</strong></p>
    <img [src]="respuestaExitosa.imagen_principal" alt="Imagen guardada" class="preview-img" />
  </div>
</div>
