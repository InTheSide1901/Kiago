<main class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-7xl mx-auto">
    <div class="items-center justify-center text-center">
      <h1 class="font-bold text-4xl sm:text-5xl">Encuentra tu próximo destino</h1>
    </div>
    <!-- Se agrega (submit)="$event.preventDefault()" para evitar que la página recargue al dar Enter -->
    <!-- 1. Cambiamos el submit para que ejecute aplicarFiltros() -->
    <form class="max-w-3xl mx-auto w-full px-4 my-7 pb-7" (ngSubmit)="aplicarFiltros()">
      <label for="search" class="sr-only">Search</label>
      <div class="relative flex items-center">
        <!-- Ícono de lupa -->
        <div class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none">
          <svg
            class="w-5 h-5 text-gray-500"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            />
          </svg>
        </div>

        <!-- 2. Quitamos el (input)="aplicarFiltros()" de aquí -->
        <input
          type="search"
          id="search"
          name="busqueda"
          [(ngModel)]="busqueda"
          class="block w-full py-3.5 ps-11 pe-28 text-base text-gray-700 bg-white border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-[#2e5d32] focus:border-transparent placeholder:text-gray-400 shadow-sm"
          placeholder="Buscar museos, ciudades, gastronomía..."
          required
        />

        <button
          type="submit"
          class="absolute inset-e-2 text-white bg-[#2e5d32] hover:bg-[#234827] focus:ring-4 focus:ring-green-100 font-medium rounded-2xl text-sm px-6 py-2 transition-colors"
        >
          Buscar
        </button>
      </div>
    </form>

    <!-- Contenedor Flex: Divide la pantalla en Sidebar (Filtros) y Main (Resultados) -->
    <div class="flex flex-col lg:flex-row gap-8">
      <!-- ================================
           BARRA LATERAL DE FILTROS 
           ================================ -->
      <aside class="w-full lg:w-1/4 flex-shrink-0">
        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm sticky top-4">
          <h3 class="font-bold text-lg text-[#0b1329] mb-4">Filtros populares</h3>

          <!-- Grupo de Filtros 1 -->
          <div class="space-y-3">
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                (change)="toggleCategoria('Gastronomia', $event)"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Gastronomia</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                (change)="toggleCategoria('Parques', $event)"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Parques</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                (change)="toggleCategoria('Alojamientos', $event)"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Alojamientos</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                (change)="toggleCategoria('Museos', $event)"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Museos</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                (change)="toggleCategoria('Eventos', $event)"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Eventos</span>
            </label>
          </div>

          <hr class="my-6 border-gray-200" />

          <!-- Grupo de Filtros 2 -->
          <h3 class="font-bold text-lg text-[#0b1329] mb-4">Puntuación</h3>
          <div class="space-y-3">
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Excelente: 4.5 o más</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                class="cursor-pointer w-5 h-5 rounded border-gray-300 text-[#5cb85c] focus:ring-[#5cb85c]"
              />
              <span class="text-sm text-gray-700">Muy bueno: 4 o más</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- ================================
           ÁREA DE RESULTADOS 
           ================================ -->
      <section class="w-full lg:w-3/4">
        <!-- Encabezado de resultados -->
        <div class="flex items-center justify-between mb-6">
          <!-- Actualizado para mostrar la cantidad de filtrados -->
          <h2 class="text-xl font-bold text-[#0b1329]">
            Resultados ({{ lugaresFiltrados.length }})
          </h2>
        </div>

        <!-- Grilla de Tarjetas -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          <!-- Actualizado para iterar sobre lugaresFiltrados y aplicando el paginado si lo deseas -->
          @for (lugar of lugaresFiltrados; track lugar.id) {
            <div
              class="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col"
            >
              <img
                src="{{ lugar.imagenUrl }}"
                alt="Lugar"
                class="w-full h-48 object-cover bg-gray-100"
              />

              <div class="p-5 flex-1 flex flex-col">
                <div class="flex justify-between items-start mb-2">
                  <h3 class="text-lg font-bold text-[#0b1329]">{{ lugar.nombre }}</h3>
                  <span
                    class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-0.5 rounded text-center"
                  >
                    {{ lugar.categoria }}
                  </span>
                </div>

                <p class="text-sm text-gray-500 mb-4 flex-1 line-clamp-4">
                  {{ lugar.descripcion }}
                </p>

                <div
                  class="flex items-center justify-between mt-auto"
                  [routerLink]="['/inicio/categoria', lugar.categoria_id, 'detalle', lugar.id]"
                >
                  <span class="text-sm font-medium text-gray-700">⭐ 4.5</span>
                  <button
                    class="px-4 py-2 bg-[#5cb85c] hover:bg-[#479E47] text-white text-xs font-semibold rounded-xl transition-colors cursor-pointer"
                  >
                    Ver detalle
                  </button>
                </div>
              </div>
            </div>
          } @empty {
            <div
              class="col-span-full text-center py-10 text-gray-500 bg-white rounded-2xl border border-gray-200"
            >
              No se encontraron lugares disponibles.
            </div>
          }
        </div>
      </section>
    </div>
  </div>
</main>
