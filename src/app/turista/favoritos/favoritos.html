<div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6 font-sans">
  
  <!-- Encabezado de la sección -->
  <div class="flex items-center justify-between border-b border-gray-100 pb-4 px-1">
    <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight flex items-center gap-3">
      <!-- Ícono de Corazón -->
      <svg class="w-7 h-7 text-red-500" fill="currentColor" viewBox="0 0 24 24">
        <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
      Tus Favoritos
    </h2>
  </div>

  <!-- Lista de Locales -->
  <div class="space-y-4">
    
    @for (local of localesFav; track local.id) {
      <article class="group bg-white rounded-2xl p-3 sm:p-4 shadow-sm hover:shadow-lg border border-gray-100 transition-all duration-300 flex items-center gap-4 sm:gap-6">
        
        <!-- Imagen principal -->
        <a [routerLink]="['/inicio/categoria', local.categoria_id || 1, 'detalle', local.id]"
           class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-xl overflow-hidden bg-gray-100 shrink-0 block">
          <img [src]="local.imagen_principal || 'assets/placeholder.jpg'" [alt]="local.nombre"
               class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>
        </a>

        <!-- Información central -->
        <div class="flex-1 min-w-0 py-1 flex flex-col justify-center">
          <a [routerLink]="['/inicio/categoria', local.categoria_id || 1, 'detalle', local.id]"
             class="text-base sm:text-lg font-bold text-gray-900 hover:text-red-500 transition-colors line-clamp-1 mb-1">
            {{ local.nombre }}
          </a>
          
          <div class="flex items-center gap-3 text-sm mt-2">
            <span class="flex items-center gap-1 text-amber-500 font-bold bg-amber-50 px-2 py-1 rounded-lg">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
              </svg>
              4.8
            </span>
            <span class="text-gray-300">•</span>
            <span class="text-gray-500 text-xs sm:text-sm font-medium truncate">
              Ver detalles &rarr;
            </span>
          </div>
        </div>

        <!-- Botón Eliminar -->
        <button (click)="eliminar(local.id)"
                class="p-2 sm:px-4 sm:py-2 rounded-xl text-gray-400 hover:text-red-600 hover:bg-red-50 transition-all duration-200 flex items-center gap-2 group/btn shrink-0"
                title="Eliminar de favoritos">
          <svg class="w-5 h-5 group-hover/btn:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span class="hidden sm:block text-sm font-semibold">Eliminar</span>
        </button>
        
      </article>

    } @empty {
      
      <!-- DISEÑO CUANDO NO HAY FAVORITOS -->
      <div class="flex flex-col items-center justify-center py-16 px-4 text-center bg-gray-50 rounded-3xl border border-dashed border-gray-200">
        <div class="bg-gray-100 p-4 rounded-full mb-4">
          <!-- Ícono de corazón roto / vacío -->
          <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" opacity="0.6"/>
          </svg>
        </div>
        <h3 class="text-xl font-bold text-gray-800 mb-2">Aún no tienes favoritos</h3>
        <p class="text-gray-500 max-w-md mx-auto mb-6 text-sm">
          Explora los diferentes lugares y guarda los que más te gusten para tenerlos siempre a mano en esta sección.
        </p>
        <a routerLink="/inicio/categoria" 
           class="inline-flex items-center gap-2 px-6 py-2.5 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition-colors shadow-sm">
          Explorar locales
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </a>
      </div>
      
    }
  </div>
</div>
