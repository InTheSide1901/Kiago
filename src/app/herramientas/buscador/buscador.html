<div class="relative w-full max-w-xl mx-auto">
  <!-- Input del Buscador -->
  <div class="relative flex items-center">
    <!-- Icono Lupa -->
    <div class="absolute left-4 text-slate-400 pointer-events-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>

    <!-- Campo de Texto -->
    <input 
      type="text" 
      [value]="textoBusqueda()"
      (input)="onInput($event)"
      (focus)="textoBusqueda() && mostrarResultados.set(true)"
      placeholder="Buscar locales, restaurantes, parques..." 
      class="w-full pl-11 pr-10 py-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-800 placeholder-slate-400 text-sm transition-all"
    />

    <!-- Indicator Spinner Carga -->
    @if (cargando()) {
      <div class="absolute right-4">
        <div class="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
      </div>
    }
  </div>

  <!-- Desplegable de Resultados -->
  @if (mostrarResultados() && textoBusqueda().trim().length > 0) {
    <div class="absolute z-50 left-0 right-0 mt-2 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
      
      @if (resultados().length > 0) {
        <ul class="divide-y divide-slate-50">
          @for (local of resultados(); track local.id) {
            <li>
              <button 
                (click)="seleccionarLocal(local)" 
                class="w-full px-5 py-3.5 text-left hover:bg-indigo-50/60 transition-colors flex items-center justify-between group cursor-pointer"
              >
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4"/>
                    </svg>
                  </div>
                  <span class="font-medium text-slate-800 group-hover:text-indigo-600 text-sm transition-colors">
                    {{ local.nombre }}
                  </span>
                </div>
                <span class="text-xs font-semibold text-slate-400 group-hover:text-indigo-600 flex items-center gap-1">
                  Ver
                  <span class="group-hover:translate-x-0.5 transition-transform">&rarr;</span>
                </span>
              </button>
            </li>
          }
        </ul>
      } @else if (!cargando()) {
        <!-- Estado sin coincidencias -->
        <div class="p-4 text-center text-sm text-slate-500">
          No se encontraron locales con el nombre "<span class="font-semibold">{{ textoBusqueda() }}</span>"
        </div>
      }
    </div>
  }
</div>
