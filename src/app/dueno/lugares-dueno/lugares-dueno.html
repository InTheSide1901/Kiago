<app-navbar-dueno></app-navbar-dueno>


<div class="min-h-screen bg-[#f8f9fc] p-4 sm:p-6 md:p-10 font-sans text-slate-800">
  <div class="max-w-7xl mx-auto">

    <!-- Encabezado y Saludo -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-5">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Establecimientos</p>
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2 flex items-center gap-2">
          Mis lugares
        </h1>
        <p class="text-slate-500 font-medium text-sm md:text-base">
          Administrá tus publicaciones y su estado de revisión.
        </p>
      </div>

      <button routerLink="/panel-dueno/formulario-dueno"
        class="w-full md:w-auto bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 px-6 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Nuevo lugar
      </button>
    </header>



    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mb-6">

      <div class="flex items-center gap-3 mb-4">
        <div class="absolute flex items-center ps-4 pointer-events-none">
          <svg class="w-5 h-5 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
          </svg>
        </div>

        <input [(ngModel)]="busqueda" placeholder="Buscar por nombre, categoría o dirección..."
          class="block w-full py-3.5 ps-11 pe-28 text-base text-gray-700 bg-white border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent placeholder:text-gray-400 shadow-sm" />

        <button (click)="realizarBusqueda()" class="bg-indigo-600 hover:bg-indigo-700 text-white
               px-5 py-3 rounded-xl font-medium">
          Buscar
        </button>
      </div>

      <div class="flex flex-row flex-wrap items-center  gap-2">
        <button onclick="filtro()"
          class="w-full md:w-auto bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Todos
        </button>
        <button onclick="filtro()"
          class="w-full md:w-auto bg-emerald-50 hover:bg-emerald-100 text-emerald-600 text-x font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Aprobados
        </button>
        <button onclick="filtro()"
          class="w-full md:w-auto bg-amber-50 hover:bg-amber-100 text-amber-600 font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Pendientes
        </button>
        <button onclick="filtro()"
          class="w-full md:w-auto bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Rechazados
        </button>
      </div>
    </div>
    

    <!-- Tabla de establecimientos -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">

      <table class="w-full text-left">

        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase">
              Lugar
            </th>

            <th class="px-12 py-4 text-xs font-bold text-gray-500 uppercase">
              Categoría
            </th>

            <th class="px-12 py-4 text-xs font-bold text-gray-500 uppercase">
              Estado
            </th>

            <th class="px-12 py-4 text-xs font-bold text-gray-500 uppercase">
              Dirección
            </th>


          </tr>
        </thead>

        <tbody class="divide-y divide-gray-100">

          <tr *ngFor="let local of locales" class="hover:bg-gray-50 transition-colors">

            <td class="px-6 py-5">
              <p class="font-semibold text-gray-900">
                {{ local.nombre_local }}
              </p>
              <p class="text-xs text-gray-400 mt-1">
                #{{ local.local_id }}
              </p>
            </td>

            <td class="px-12 py-5 text-md text-gray-600">
              {{ local.categoria }}
            </td>

            <td class="px-12 py-5">
              <span class="inline-flex items-center px-3 py-1 rounded-full
                     text-md font-semibold" [ngClass]="{
                'bg-emerald-100 text-emerald-600': local.estado === 'Aprobado',
                'bg-amber-100 text-amber-600': local.estado === 'Pendiente',
                'bg-rose-100 text-rose-600': local.estado === 'Rechazado'
              }">
                {{ local.estado }}
              </span>
            </td>

            <td class="px-12 py-5 text-md text-gray-600">
              {{ local.calle }} {{ local.altura }}
            </td>



          </tr>

        </tbody>

      </table>

    </div>
  </div>


</div>
