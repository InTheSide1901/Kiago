<nav class="bg-slate-900 text-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo o Nombre de la App -->
      <div class="flex items-center space-x-3">
        <a routerLink="/inicio/categoria" class="text-xl font-bold tracking-wide text-white hover:text-emerald-400 transition">
          Mi App KIAGO
        </a>
      </div>

      <!-- Estado de Autenticación / Acciones -->
      <div class="flex items-center space-x-4">
        
        <!-- SI EL USUARIO ESTÁ LOGUEADO (Evaluamos la Signal) -->
        @if (authService.currentUser()) {
          <div class="flex items-center space-x-3">
            <span class="text-sm font-medium text-gray-200">
              Hola, <strong class="text-emerald-400">{{ authService.currentUser().nombre }}</strong>
            </span>

            <button 
              (click)="onLogout()" 
              class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold px-3 py-1.5 rounded-md transition shadow-sm">
              Cerrar Sesión
            </button>
          </div>
        } 
        
        <!-- SI EL USUARIO NO ESTÁ LOGUEADO -->
        @else {
          <div class="flex items-center space-x-2">
            <a 
              routerLink="/login" 
              class="text-gray-300 hover:text-white text-sm font-medium px-3 py-1.5 rounded-md transition">
              Iniciar Sesión
            </a>
            <a 
              routerLink="/register" 
              class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-3 py-1.5 rounded-md transition shadow-sm">
              Registrarse
            </a>
          </div>
        }

      </div>

    </div>
  </div>
</nav>
